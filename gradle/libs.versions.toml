# Versions checked against the official repositories on 2026-11-15
# (Google Maven, Maven Central, services.gradle.org) with the "Versions probe" workflow.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
junit = "4.13.2"
androidxJunit = "1.3.0"
robolectric = "4.18"
ksp = "2.3.14"
room = "2.8.5"
navigation = "2.10.2"
