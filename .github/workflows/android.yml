name: Android CI

on:
  push:
    branches: [dev, master]
    tags: ['m*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this tag and publish a release (for example m1-rc1). Leave empty for a normal build.'
        required: false
        default: ''

permissions:
  contents: write   # needed to publish releases on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      VERSION_NAME: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || format('0.0.0-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSWORD
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SIGNING_PASSWORD is not set. The release APK is not signed and no release is published."
          fi

      - name: Build, test, screenshots, lint
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease recordRoborazziDebug lintDebug

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          [ -n "$apk" ] && cp "$apk" "out/MMr.NameList-${VERSION_NAME}.apk"
          cp app/build/outputs/roborazzi/*.png out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: namelist-${{ github.run_number }}
          path: |
            out/
            app/build/reports/
          if-no-files-found: warn

      - name: Push screenshots to the ci-screenshots branch
        # Agents without artifact access fetch screenshots from this branch (AGENTS.md).
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.png >/dev/null 2>&1 || { echo "No screenshots."; exit 0; }
          mkdir -p "$RUNNER_TEMP/shots" && cp out/*.png "$RUNNER_TEMP/shots/"
          # Room schema files are generated here; agents copy them into app/schemas/.
          [ -d app/schemas ] && cp -r app/schemas "$RUNNER_TEMP/shots/schemas"
          cd "$RUNNER_TEMP/shots"
          echo "Screenshots from run ${{ github.run_number }} on ${{ github.ref_name }} (${{ github.sha }})." > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "screenshots: run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Check APK signature
        if: env.SIGNING_STORE_FILE != ''
        env:
          # SHA-256 of the release certificate (signing/README.md).
          EXPECTED_CERT: 3a7cb4dbffa06864b3858dc21cd4d248f0a0b2687820524aec5cb28e54a998f3
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $apksigner"
          "$apksigner" verify --verbose --print-certs out/*.apk | tee verify.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" verify.txt \
            || { echo "::error::APK is not signed with the release key."; exit 1; }

      - name: Publish release
        if: env.RELEASE_TAG != '' && env.SIGNING_STORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          prerelease=""
          case "$TAG" in *-rc*) prerelease="--prerelease";; esac
          cat > notes.md <<NOTES
          Install: download \`MMr.NameList-${TAG}.apk\` on your Android phone and open it.
          Screenshots are attached. Milestone details: docs/milestones.md and docs/progress.md.
          NOTES
          gh release create "$TAG" out/* $prerelease --title "Name List ${TAG}" --notes-file notes.md --target "$GITHUB_SHA"
